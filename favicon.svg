<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Símbolo MilestoneIQ: M de 5 nodos-anillo y 6 aristas (guía de estilo). -->
  <defs>
    <linearGradient id="g" x1="0" y1="80" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b50e0"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#41a8e0"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="80">
      <rect width="100" height="80" fill="#fff"/>
      <circle cx="14" cy="66" r="5" fill="#000"/>
      <circle cx="24.5" cy="14" r="5" fill="#000"/>
      <circle cx="50" cy="44" r="5" fill="#000"/>
      <circle cx="75.5" cy="14" r="5" fill="#000"/>
      <circle cx="86" cy="65.5" r="5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#m)" stroke="url(#g)" stroke-width="6.4" fill="none">
    <line x1="14" y1="66" x2="24.5" y2="14"/>
    <line x1="24.5" y1="14" x2="50" y2="44"/>
    <line x1="50" y1="44" x2="14" y2="66"/>
    <line x1="50" y1="44" x2="75.5" y2="14"/>
    <line x1="75.5" y1="14" x2="86" y2="65.5"/>
    <line x1="86" y1="65.5" x2="50" y2="44"/>
    <circle cx="14" cy="66" r="8.2"/>
    <circle cx="24.5" cy="14" r="8.2"/>
    <circle cx="50" cy="44" r="8.2"/>
    <circle cx="75.5" cy="14" r="8.2"/>
    <circle cx="86" cy="65.5" r="8.2"/>
  </g>
</svg>
